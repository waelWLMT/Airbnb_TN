version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Password123!"  # mot de passe pour l’admin
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - backend-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # pour les microservices
      - "15672:15672"   # interface web RabbitMQ
    networks:
      - backend-network

  apigateway:
    build:
      context: ./src/gateway/ApiGateway
      dockerfile: Dockerfile
    container_name: apigateway
    ports:
      - "5000:80"
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
